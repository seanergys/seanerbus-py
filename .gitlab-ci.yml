stages:
  - prebuild
  - build
  - test
  - docs
  - end_to_end

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: 0
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_STRATEGY: recursive

reuse-lint:
  stage: prebuild
  image: python:latest
  script:
    - pip install reuse
    - reuse lint

build-python:
  image: python:latest
  stage: build
  script:
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev
    - pip install uv
    - uv build

test:ruff-format:
  image: python:latest
  stage: test
  script:
    - pip install ruff
    - ruff format --check

test:test:
  image: python:latest
  stage: test
  script:
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git".insteadOf ssh://git@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.seanergys.fz-juelich.de/software/seanerbus-msg.git".insteadOf git@gitlab.seanergys.fz-juelich.de:software/seanerbus-msg.git
    - pip install uv
    - uv venv
    - uv pip install ".[test]"
    - uv run pytest tests/test.py

