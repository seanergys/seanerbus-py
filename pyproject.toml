[build-system]
requires = ["setuptools"]

[project]
dependencies = [
  "pycapnp", "seanerbus_cpp_py"
]
name = "seanerbus"
version = "0.0.1"

requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools]
# ...
# By default, include-package-data is true in pyproject.toml,
# so you do NOT have to specify this line.
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seanerbus = ["client/internal.capnp", "msg/schemas/msg.capnp"]

[tool.uv.sources]
seanerbus_cpp_py = { git = "ssh://git@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git", rev="5a9ba44f4d3e984bbbaf3cc91f98bd6bc57e0eec"}
[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = ["F405", "F403"]
[tool.ruff.format]

# pyproject.toml
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
]
